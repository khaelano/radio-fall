[build-system]
requires = ["setuptools>=68", "setuptools-rust>=1.11"]
build-backend = "setuptools.build_meta"

[project]
name = "radio-fall-detection"
version = "0.1.0"
description = "Radio fall detector with scheduled ESP-NOW CSI collection and operator labeling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
analysis = [
    "polars>=1.0",
    "matplotlib>=3.8",
    "pyarrow>=18",
    "scikit-learn>=1.5",
]
radio = [
    "pyserial>=3.5",
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
]
video = [
    "av>=14",
]
detection = [
    "torch==2.14.1",
]

[project.scripts]
csi-viewer = "fall_detection.radio.visualization.app:main"
csi-radio = "fall_detection.radio.provisioning:main"
csi-gateway-benchmark = "fall_detection.radio.experiments.gateway:main"
fall-collection = "fall_detection.collection.app:main"
fall-session-inspector = "fall_detection.session_inspector.app:main"
fall-detect = "fall_detection.detection.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "setup.cfg" },
    { dir = "src" },
    { file = "MANIFEST.in" },
    { file = "src/native/radio_core/Cargo.toml" },
    { file = "src/native/radio_core/Cargo.lock" },
    { file = "src/native/radio_core/src/*.rs" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["fall_detection*"]

[[tool.setuptools-rust.ext-modules]]
target = "fall_detection._radio_native"
path = "src/native/radio_core/Cargo.toml"
binding = "PyO3"
debug = false

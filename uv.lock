[[package]]
name = "radio-fall-detection"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "numpy" },
    { name = "pandas" },
    { name = "zstandard" },
]

[package.optional-dependencies]
analysis = [
    { name = "matplotlib" },
    { name = "polars" },
    { name = "pyarrow" },
    { name = "scikit-learn" },
]
cuda = [
    { name = "torch", version = "2.14.1+cu130", source = { registry = "https://download.pytorch.org/whl/cu130" }, marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
detection = [
    { name = "torch", version = "2.14.1", source = { registry = "https://download.pytorch.org/whl/cpu" }, marker = "(sys_platform == 'darwin' and extra == 'extra-20-radio-fall-detection-detection') or (extra == 'extra-20-radio-fall-detection-cuda' and extra == 'extra-20-radio-fall-detection-detection')" },
    { name = "torch", version = "2.14.1+cpu", source = { registry = "https://download.pytorch.org/whl/cpu" }, marker = "(sys_platform != 'darwin' and extra == 'extra-20-radio-fall-detection-detection') or (extra == 'extra-20-radio-fall-detection-cuda' and extra == 'extra-20-radio-fall-detection-detection')" },
]
notebook = [
    { name = "ipykernel" },
    { name = "nbconvert" },
]
radio = [
    { name = "pyarrow" },
    { name = "pyqtgraph" },
    { name = "pyserial" },
    { name = "pyside6" },
]
tinygrad-legacy = [
    { name = "tinygrad" },
]
video = [
    { name = "av" },
]

[package.dev-dependencies]
dev = [
    { name = "pytest" },
]

[package.metadata]
requires-dist = [
    { name = "av", marker = "extra == 'video'", specifier = ">=14" },
    { name = "ipykernel", marker = "extra == 'notebook'", specifier = ">=6,<8" },
    { name = "matplotlib", marker = "extra == 'analysis'", specifier = ">=3.8" },
    { name = "nbconvert", marker = "extra == 'notebook'", specifier = ">=7,<8" },
    { name = "numpy", specifier = ">=1.24" },
    { name = "pandas", specifier = ">=2.0" },
    { name = "polars", marker = "extra == 'analysis'", specifier = ">=1.0" },
    { name = "pyarrow", marker = "extra == 'analysis'", specifier = ">=18" },
    { name = "pyarrow", marker = "extra == 'radio'", specifier = ">=18" },
    { name = "pyqtgraph", marker = "extra == 'radio'", specifier = ">=0.13" },
    { name = "pyserial", marker = "extra == 'radio'", specifier = ">=3.5" },
    { name = "pyside6", marker = "extra == 'radio'", specifier = ">=6.6" },

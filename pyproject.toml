[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radio-fall-detection"
version = "0.1.0"
description = "Radio fall detector with USB CSI collection and operator labeling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
radio = [
    "pyserial>=3.5",
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
]
vision = [
    "ncnn",
    "pnnx",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "ultralytics>=8.4.174",
]

[project.scripts]
camera-fall-detector = "fall_detection.vision.live:main"
csi-viewer = "fall_detection.radio.visualization.app:main"
csi-radio-discover = "fall_detection.radio.provisioning:discover"
csi-radio-provision = "fall_detection.radio.provisioning:provision"
csi-experiment = "fall_detection.radio.experiments.transport:main"
fall-collection = "fall_detection.collection.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["fall_detection*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radio-fall-detection"
version = "0.1.0"
description = "Radio fall detector with USB CSI collection and operator labeling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.8",
]
radio = [
    "pyserial>=3.5",
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
]

[project.scripts]
csi-viewer = "fall_detection.radio.visualization.app:main"
csi-radio-discover = "fall_detection.radio.provisioning:discover"
csi-radio-provision = "fall_detection.radio.provisioning:provision"
csi-experiment = "fall_detection.radio.experiments.transport:main"
fall-collection = "fall_detection.collection.app:main"
fall-session-inspector = "fall_detection.session_inspector.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["fall_detection*"]

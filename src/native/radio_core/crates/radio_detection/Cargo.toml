[package]
name = "radio-detection"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[dependencies]
radio-transport = { path = "../radio_transport" }
radio-preprocessing = { path = "../radio_preprocessing" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "=0.10.9"
ndarray = "=0.17.2"
ndarray-npy = { version = "=0.10.0", default-features = false, features = ["npz"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-31"] }

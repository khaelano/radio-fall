[package]
name = "radio-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
name = "_radio_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py312", "num-complex"] }
num-complex = "0.4"
crc32fast = "1.5"
memchr = "2.7"
libc = "0.2"
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1

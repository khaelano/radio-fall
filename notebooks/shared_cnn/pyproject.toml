[project]
name = "csi-cnn-pilot"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<3", "matplotlib>=3.9,<4",
  "scikit-learn>=1.5,<2", "torch>=2.5,<3", "pytest>=8,<10",
]

[project.optional-dependencies]
notebook = ["ipykernel>=6,<8", "nbconvert>=7,<8"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
